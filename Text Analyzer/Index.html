<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Analyzer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h3>Text Analyzer</h3>

    <textarea id="input" class="input" placeholder="Start typing here..."></textarea>

    <div class="result-area">
      <div class="resultBox">
        <span id="letters">0</span>
        <p>Letters</p>
      </div>

      <div class="resultBox">
        <span id="words">0</span>
        <p>Words</p>
      </div>

      <div class="resultBox">
        <span id="vowels">0</span>
        <p>Vowels</p>
      </div>

      <div class="resultBox">
        <span id="characters">0</span>
        <p>Characters</p>
      </div>
    </div>

    <div class="resetBtn">
      <button id="reset">Reset</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
