<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="main">
        <!-- main Container -->
        <div class="container">
            <h1>Temperature Converter <i class="fa-solid fa-temperature-half"></i> </h1>
            <form>
                <!-- input fields -->
                <div class="input-container">

                    <input type="number" class="input-value" name="celsius">
                    <select id="temperatureUnit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>
                <!-- flip button -->
                <div class="flip-button">
                    <i class="fa-solid fa-retweet"></i>

                </div>
                <div class="output-contaner">
    
                    <input type="number" class="output-value" name="fahrenheit" readonly>
                    <select id="temperatureUnit2">
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="celsius">Celsius (°C)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>
                <div class="buttons">
                    <button type="button" id="convertButton"> Convert <i class="fa-solid fa-arrows-rotate"></i></button>
                    <button type="button" id="resetButton"> Reset <i class="fa-solid fa-rotate-left"></i></button>
                </div>
            </form>
            <p id="result"></p>
        </div>
    </div>
    <script src="script.js"></script>


</body>

</html>
