<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Age Calculator</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="icon">
            <i class="fa-solid fa-calendar-days"></i>
        </div>

        <h1>Quick Age Calculator</h1>

        <p class="subtitle">
            Instantly calculate your exact age in years, months and days
        </p>

        <div class="card">

            <div class="field-group">
                <label for="dob">Select Your Birthdate</label>
                <input type="date" id="dob">
            </div>

            <div class="buttons">
                <button id="calculate">
                    Calculate Age
                </button>

                <button id="reset" aria-label="Reset form">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <div id="result" class="result-panel" aria-live="polite">
                <div class="result-content">
                    <p class="result-label">Your age</p>
                    <div class="result-grid">
                        <div class="result-item">
                            <span class="result-value" data-unit="years">0</span>
                            <span class="result-unit">Years</span>
                        </div>
                        <div class="result-item">
                            <span class="result-value" data-unit="months">0</span>
                            <span class="result-unit">Months</span>
                        </div>
                        <div class="result-item">
                            <span class="result-value" data-unit="days">0</span>
                            <span class="result-unit">Days</span>
                        </div>
                    </div>
                </div>
                <p id="result-message" class="result-message" hidden></p>
            </div>

        </div>

        <p class="footer">
            Accurate age calculation from your birthdate to today
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
