<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" />
    <title>TaskFlow Pro</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="head">
        <div class="brand">
          <div class="logo">
            <img src="icons/logo.png" alt="" />
          </div>
          <span class="brand-name">TaskFlow Pro</span>
        </div>
        <div class="search-box">
          <input type="search" placeholder="Search tasks..." aria-label="Search tasks" />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="profil">
          <i class="fa-solid fa-bell" aria-hidden="true"></i>
          <i class="fa-solid fa-circle-user"></i>
          <button class="sing-up">Sign Up</button>
          <button id="theme-btn" type="button" aria-label="Switch to dark theme">
            <i class="fa-regular fa-moon" aria-hidden="true" id="change-mood"></i>
          </button>
        </div>
      </div>
    </header>
    <main>
      <section class="dashboard">
        <div class="dashbord-heading">
          <h1>Dashboard</h1>
          <h3>Welcome back Sagar Kumar</h3>
        </div>
        <div class="dashboard-cards">
          <div class="total-card box">
            <p>Total Tasks</p>
            <h1><span class="task-count">0</span> <i class="fa-solid fa-clipboard-list t"></i></h1>
          </div>
          <div class="completed-card box">
            <p>Completed</p>
            <h1><span class="completed-count">0</span> <i class="fa-solid fa-check-double c"></i></h1>
          </div>
          <div class="pending-card box">
            <p>Pending</p>
            <h1><span class="pending-count">0</span> <i class="fa-regular fa-clock p"></i></h1>
          </div>
          <div class="overdue-card box">
            <p>Overdue</p>
            <h1><span class="overdue-count">0</span> <i class="fa-solid fa-circle-exclamation o"></i></h1>
          </div>
        </div>
      </section>
      <section class="add-task">
        <div class="add-task-container">
          <h2>Add New Task</h2>

          <form id="task-form">
            <div class="form-row">
              <div class="form-group">
                <label for="task-name">Task Name</label>
                <input
                  type="text"
                  id="task-name"
                  placeholder="Enter task name"
                  required
                />
              </div>

              <div class="form-group">
                <label for="progress_status">Status</label>

                <select id="progress_status">
                  <option value="pending">Pending</option>
                  <option value="progress">In Progress</option>
                  <option value="completed">Completed</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="due-date">Due Date</label>
                <input type="date" id="due-date" />
              </div>

              <div class="form-group">
                <label for="priority">Priority</label>

                <select id="priority">
                  <option value="Low">Low</option>
                  <option value="Medium">Medium</option>
                  <option value="High">High</option>
                </select>
              </div>
            </div>

            <button id="add-btn" type="submit">+ Add Task</button>
          </form>
        </div>
      </section>
      <section class="add-task-recent">
        <div class="recent-main">
          <div class="recent-tarks">
            <div class="recent-heaidng">
              <h2>Recent Tasks</h2>
            </div>
            <div class="table">
              <div class="task-table" role="table" aria-label="Recent tasks">
                <div class="task-row task-header" role="row">
                  <div class="task-cell" role="columnheader">Task</div>
                  <div class="task-cell" role="columnheader">Status</div>
                  <div class="task-cell" role="columnheader">Due Date</div>
                  <div class="task-cell" role="columnheader">Priority</div>
                  <div class="task-cell" role="columnheader">Actions</div>
                </div>
                <div id="taskTbody" role="rowgroup"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
    <script src="script.js"></script>
  </body>
</html>
